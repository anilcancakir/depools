name: CI

# The gate on every pull request. `bin/check` is the same thing locally; these
# jobs exist so a green claim is a measurement rather than a report.
#
# Unlike a forked product repo, this one resolves its siblings from pub.dev, so CI
# needs no sibling checkouts. The gitignored pubspec_overrides.yaml that points
# them at local trees during development is absent here on purpose: CI resolving
# the PUBLISHED versions is what catches a dependency on unreleased sibling code.

# `master`, not `main`. This repository's default branch is `master`, and while these
# filters said `main` the workflow matched nothing: zero runs ever, on 146 commits.
# A branch filter that names a branch which does not exist fails silently, so the
# gate reads as configured and green while never having executed once.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  # Only for pull requests: cancelling a master run would leave that commit with no
  # green record at all.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  instructions:
    name: Instruction mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: CLAUDE.md is a symlink to AGENTS.md
        run: |
          if [ ! -L CLAUDE.md ] || [ "$(readlink CLAUDE.md)" != "AGENTS.md" ]; then
            echo "CLAUDE.md must be a symlink to AGENTS.md so both tools read one file." >&2
            exit 1
          fi
      - name: .github mirrors are current
        run: bin/sync-instructions --check

      # The sibling packages are not in this checkout, so this verifies the COPIES against the hash
      # each one recorded. That catches an edit made here and cannot catch upstream drift; the
      # drift check is the same command run locally, where the siblings exist.
      - name: Package skill copies are unedited
        run: bin/sync-skills --check

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  # PHP 8.4 rather than the ^8.3 composer.json declares, because the committed
  # lock resolves symfony 8.1, which requires php >=8.4.1: `composer install` on
  # 8.3 dies in a wall of "Problem N" lines that read like a corrupt lock and are
  # really a platform mismatch. 8.4 is the floor the lock actually demands, and a
  # boilerplate is worth testing at its floor rather than at the newest release.
  backend:
    name: Backend (pint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    # The image is `pgvector/pgvector`, not plain `postgres`, and that is the point of
    # D72: a suite that skipped the vector columns would be certifying a schema it
    # never built. `POSTGRES_DB` creates the database phpunit.xml names, so no extra
    # step has to remember to.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: depools_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # `bcmath` is load-bearing rather than incidental: quantities are exact
          # decimals and `Product::quantityFromLedger()` formats them with `bcadd`
          # so the ledger's own sum never travels through a float.
          extensions: pdo_pgsql, pgsql, bcmath, intl, zip, gd
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate
      # A Blade view that calls @vite throws without a manifest, and public/build is
      # gitignored, so a page test would fail on Vite rather than on its subject.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build assets
        run: npm ci && npm run build
      - name: Pint
        run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test

  # Checkout is the whole setup: `bin/design-tokens` is bash, awk and grep over
  # `lib/**/*.dart`, so it needs neither Flutter nor a dependency install and runs
  # in well under a second. A new job rather than a step inside the Flutter one, so
  # a raw colour literal reports as its own line instead of hiding behind an
  # analyze failure.
  design-tokens:
    name: Design tokens
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Scan for raw color literals
        run: bin/design-tokens
